
name: Build Bharat Swabhiman APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q Bharat_Swabhiman_Premium_Android_Project.zip -d extracted

      - name: Build Android APK
        working-directory: extracted/Bharat_Swabhiman_Android_APK_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Swabhiman-APK
          path: extracted/Bharat_Swabhiman_Android_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
